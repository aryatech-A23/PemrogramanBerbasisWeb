<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SITTA - Pemesanan Bahan Ajar UT (Vue.js)</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <p id="boot" class="boot">Memuat aplikasi SITTA...</p>

    <!-- Root: elemen tempat Vue di-mount -->
    <div id="app" v-cloak>
      <header class="topbar">
        <div class="brand">
          <span class="logo">UT</span>
          <div>
            <h1>SITTA</h1>
            <small>Pemesanan &amp; Distribusi Bahan Ajar</small>
          </div>
        </div>
        <nav class="tabs">
          <button
            type="button"
            :class="{ aktif: tab === 'stok' }"
            @click="tab = 'stok'"
          >
            Stok Bahan Ajar
            <span
              class="count"
              v-if="jumlahPerhatian > 0"
              :title="jumlahPerhatian + ' judul perlu re-order'"
              >{{ jumlahPerhatian }}</span
            >
          </button>
          <button
            type="button"
            :class="{ aktif: tab === 'tracking' }"
            @click="tab = 'tracking'"
          >
            Tracking DO
          </button>
          <button
            type="button"
            :class="{ aktif: tab === 'order' }"
            @click="tab = 'order'"
          >
            Buat DO
          </button>
        </nav>
      </header>

      <main class="container">
        <section v-show="tab === 'stok'">
          <ba-stock-table
            :items="state.stok"
            :upbjj-list="state.upbjjList"
            :kategori-list="state.kategoriList"
            @create="tambahStok"
            @update="ubahStok"
            @remove="hapusStok"
          ></ba-stock-table>
        </section>

        <section v-show="tab === 'tracking'">
          <do-tracking
            ref="tracking"
            :data="state.tracking"
            :paket="state.paket"
            @add-progress="tambahProgres"
          ></do-tracking>
        </section>

        <section v-show="tab === 'order'">
          <order-form
            :paket="state.paket"
            :ekspedisi="state.pengirimanList"
            :next-no="nextNo"
            @created="handleNewDO"
          ></order-form>
        </section>
      </main>

      <footer class="footer">
        SITTA &middot; Tugas Praktik 3 STSI4209 &middot; Vue.js
      </footer>

      <app-modal ref="modal"></app-modal>
      <transition name="fade">
        <div class="toast" v-if="toast.tampil">{{ toast.teks }}</div>
      </transition>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/components/status-badge.js"></script>
    <script src="js/components/app-modal.js"></script>
    <script src="js/components/stock-table.js"></script>
    <script src="js/components/do-tracking.js"></script>
    <script src="js/components/order-form.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
